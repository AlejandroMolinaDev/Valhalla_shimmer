name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  PLUGINVAL_VERSION: v1.0.4
  ARTEFACTS: build/AuroraBloom_artefacts/Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            pluginval_zip: pluginval_Windows.zip
            pluginval_bin: ./pluginval/pluginval.exe
          - name: macOS
            os: macos-latest
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: ./pluginval/pluginval.app/Contents/MacOS/pluginval
          - name: Linux
            os: ubuntu-24.04
            pluginval_zip: pluginval_Linux.zip
            pluginval_bin: ./pluginval/pluginval

    steps:
      - name: Checkout (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev \
            libfontconfig1-dev libgl-dev xvfb

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -B build $GEN -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DAB_BUILD_TESTS=ON -DAB_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Run tests
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Check Windows binary has no dynamic MSVC runtime dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $bin = Get-ChildItem -Recurse -File -Filter "*.vst3" "${env:ARTEFACTS}/VST3/Aurora Bloom.vst3" | Select-Object -First 1
          $deps = & $dumpbin /dependents $bin.FullName | Out-String
          Write-Output $deps
          if ($deps -match "(?i)(vcruntime|msvcp|api-ms-win-crt)") { throw "The VST3 depends on the dynamic MSVC runtime" }

      - name: Download pluginval
        shell: bash
        run: |
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval_zip }}"
          mkdir -p pluginval && unzip -q pluginval.zip -d pluginval

      - name: pluginval (VST3, strictness 10)
        shell: bash
        run: |
          RUN=""
          if [ "$RUNNER_OS" == "Linux" ]; then RUN="xvfb-run -a"; fi
          $RUN ${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process \
            --timeout-ms 600000 --output-dir pluginval-logs "${ARTEFACTS}/VST3/Aurora Bloom.vst3"

      - name: pluginval + auval (AU)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "${ARTEFACTS}/AU/Aurora Bloom.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aufx Ablm Abau
          ${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process \
            --timeout-ms 600000 --output-dir pluginval-logs ~/Library/Audio/Plug-Ins/Components/"Aurora Bloom.component"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "${env:ARTEFACTS}/VST3/Aurora Bloom.vst3" -DestinationPath dist/AuroraBloom-Windows-VST3.zip
          Compress-Archive -Path "${env:ARTEFACTS}/Standalone/Aurora Bloom.exe" -DestinationPath dist/AuroraBloom-Windows-Standalone.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "${ARTEFACTS}/VST3/Aurora Bloom.vst3" dist/AuroraBloom-macOS-VST3.zip
          ditto -c -k --keepParent "${ARTEFACTS}/AU/Aurora Bloom.component" dist/AuroraBloom-macOS-AU.zip
          ditto -c -k --keepParent "${ARTEFACTS}/Standalone/Aurora Bloom.app" dist/AuroraBloom-macOS-Standalone.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          (cd "${ARTEFACTS}/VST3" && zip -qr "$GITHUB_WORKSPACE/dist/AuroraBloom-Linux-VST3.zip" "Aurora Bloom.vst3")

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: AuroraBloom-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs-${{ matrix.name }}
          path: pluginval-logs
          if-no-files-found: ignore

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AuroraBloom-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
